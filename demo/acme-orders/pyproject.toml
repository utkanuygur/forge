[project]
name = "acme-orders"
version = "0.3.0"
description = "Order service for the Acme storefront"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.110", "pydantic>=2.6", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
