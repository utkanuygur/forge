[project]
name = "forge"
version = "0.1.0"
description = "Create, deploy and continuously improve general-purpose agents"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "anthropic>=0.40",
  "openai>=1.50",
  "httpx>=0.27",
  "sse-starlette>=2.1",
  "typer>=0.12",
  "python-dotenv>=1.0",
]

[project.scripts]
forge = "forge.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "docker: needs a Docker daemon and the forge-sandbox image (auto-skipped when missing)",
  "e2e: starts a real Forge server subprocess (implies docker)",
  "live: calls real model APIs; runs only with `-m live` or FORGE_LIVE=1",
]
